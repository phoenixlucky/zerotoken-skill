name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 一键校验（回归测试 + 编码审计 + 文档一致性 + 版本联动）
        run: python scripts/zt.py check
